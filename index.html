<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <h1>Space Explorer</h1>
    </header>

    <main>
      <section class="filters" aria-label="Choose a date range">
        <label>
          <span>Start date</span>
          <input type="date" id="startDate" />
        </label>
        <label>
          <span>End date</span>
          <input type="date" id="endDate" />
        </label>
        <button id="getImagesButton" type="button">Get Space Images</button>
      </section>

      <section class="fact-card" aria-labelledby="factTitle">
        <h2 id="factTitle">Did You Know?</h2>
        <p id="spaceFact"></p>
      </section>

      <section id="gallery" class="gallery" aria-live="polite" aria-busy="true">
        <div class="loading-state">
          <span class="loading-spinner" aria-hidden="true"></span>
          <p>Loading space photos...</p>
        </div>
      </section>

      <nav id="pagination" class="pagination" aria-label="Gallery pages" hidden>
        <button id="previousPage" type="button">Previous</button>
        <span id="pageStatus" aria-live="polite"></span>
        <button id="nextPage" type="button">Next</button>
      </nav>
    </main>

    <dialog id="imageModal" class="image-modal" aria-labelledby="modalTitle">
      <button id="closeModal" class="modal-close" type="button" aria-label="Close details">&times;</button>
      <div id="modalMedia" class="modal-media"></div>
      <div class="modal-details">
        <p id="modalDate" class="modal-date"></p>
        <h2 id="modalTitle"></h2>
        <p id="modalExplanation" class="modal-explanation"></p>
        <a id="modalVideoLink" class="video-link" target="_blank" rel="noopener noreferrer" hidden>
          Open this video on NASA's media site
        </a>
      </div>
    </dialog>
  </div>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
